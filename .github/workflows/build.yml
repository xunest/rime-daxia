name: 构建 macOS 版

# 手动触发，或推 tag 时自动发布
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v5

      # 引擎与词库都不在仓库里（400M 语法模型超出 GitHub 限制），
      # 每次构建时从上游拉取。这样也保证用的总是最新版。
      - name: 获取引擎与词库
        env:
          # 查鼠须管版本号要调 GitHub API，匿名请求限流到 60 次/小时/IP，
          # runner 的出口 IP 是共享的，不带认证会被 403 挡掉
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash fetch_sources.sh "$RUNNER_TEMP/sources"

      - name: 生成载荷
        env:
          SQUIRREL_SRC: ${{ runner.temp }}/sources/Squirrel.app
          RIME_SRC: ${{ runner.temp }}/sources/rime
        run: |
          # make_payload.sh 需要 .icns 与可执行文件才能导出菜单栏矢量图标，
          # 这两样由完整的 build.sh 产出——build.sh test 只跑自测就退出了。
          bash build.sh
          bash make_payload.sh

      - name: 打包（内嵌载荷）
        # 载荷已就位，再跑一次把它嵌进 app 并出 zip
        run: bash release.sh --zip

      - name: 校验产物
        run: |
          APP="dist/大侠输入法.app"
          echo "架构：$(lipo -archs "$APP/Contents/MacOS/DaxiaIME")"
          # 必须是双架构，否则 Intel 机器装不了
          lipo -archs "$APP/Contents/MacOS/DaxiaIME" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/DaxiaIME" | grep -q arm64
          codesign --verify --deep --strict "$APP"
          echo "签名有效"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 大侠输入法
          path: 大侠输入法.zip
          # 400M 的包留太久会占满配额
          retention-days: 14

      # 推 tag 时顺便发一个 Release，方便分享下载链接
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 大侠输入法.zip
          body: |
            下载 `大侠输入法.zip`，解压后双击安装。

            首次打开若被系统拦截，右键点图标选「打开」，
            或在终端执行 `xattr -cr 大侠输入法.app`。

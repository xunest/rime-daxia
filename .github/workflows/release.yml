name: 发布

# 只在发版时跑：打 tag 推上去，或在网页上手动触发。
#
# 这条流程要下载几百兆的引擎与词库、压缩载荷、双架构编译，
# 一次约 20 分钟。macOS runner 按 10 倍计费，实际扣 200 分钟额度，
# 所以不放在日常推送里。日常检查见 ci.yml。
on:
  push:
    tags:
      - "v*"
  # 手动触发时不发 Release，只产出可下载的构建产物，便于发版前试装
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-14

    # CI 自带的 GITHUB_TOKEN 默认只读，创建 Release 需要显式给写权限，
    # 否则最后一步会 403 "Resource not accessible by integration"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # 引擎与词库都不在仓库里（400M 语法模型超出 GitHub 限制），
      # 每次构建时从上游拉取。这样也保证用的总是最新版。
      - name: 获取引擎与词库
        env:
          # 查鼠须管版本号要调 GitHub API，匿名请求限流到 60 次/小时/IP，
          # runner 的出口 IP 是共享的，不带认证会被 403 挡掉
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash fetch_sources.sh "$RUNNER_TEMP/sources"

      - name: 生成载荷
        env:
          SQUIRREL_SRC: ${{ runner.temp }}/sources/Squirrel.app
          RIME_SRC: ${{ runner.temp }}/sources/rime
        run: |
          # make_payload.sh 需要 .icns 与可执行文件才能导出菜单栏矢量图标，
          # 这两样由完整的 build.sh 产出——build.sh test 只跑自测就退出了。
          bash build.sh
          bash make_payload.sh

      - name: 打包（内嵌载荷）
        # 载荷已就位，再跑一次把它嵌进 app 并出 zip
        run: bash release.sh --zip

      - name: 校验产物
        run: |
          APP="dist/大侠输入法.app"
          echo "架构：$(lipo -archs "$APP/Contents/MacOS/DaxiaIME")"
          # 必须是双架构，否则 Intel 机器装不了
          lipo -archs "$APP/Contents/MacOS/DaxiaIME" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/DaxiaIME" | grep -q arm64
          codesign --verify --deep --strict "$APP"
          echo "签名有效"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 大侠输入法
          path: 大侠输入法.zip
          # 400M 的包留太久会占满配额
          retention-days: 14

      - name: 发布 Release
        # 只有打了 tag 才发布；手动触发只产出上面那个构建产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 大侠输入法.zip
          # 尚未在多台机器验证过，标为预发布更诚实
          prerelease: true
          body: |
            ## 安装

            下载 `大侠输入法.zip`，解压后双击 app，点「安装」并输入密码。

            装完会自动切换到大侠输入法，可以直接打字。

            ## 首次打开被系统拦截

            这个包用的是 adhoc 签名（没有 Apple 开发者证书），
            首次打开需要绕过 Gatekeeper：

            **右键点图标 → 选「打开」→ 再点「打开」**

            或在终端执行：

            ```bash
            xattr -cr 大侠输入法.app
            ```

            ## 说明

            - 支持 Intel 与 Apple 芯片，一个包通用
            - 需要 macOS 13.0 或更高版本
            - 已在用 Rime 的话，你的词库与设置不会被覆盖
            - 纯本地离线，不联网、不上传任何输入数据

            ## 卸载

            ```bash
            sudo rm -rf "/Library/Input Methods/Squirrel.app"
            rm -rf ~/Library/Rime
            rm -rf "/Applications/大侠输入法.app"
            ```

            卸载前先点状态栏图标选「退出」，否则进程还在会残留图标。
